# lab/seed/machines.yaml
#
# Source-of-truth for Igor's machine registry (the fleet he can route inference to).
# File → DB pattern (hand-curated; DB is runtime cache).
#
# 2026-04-18: post-collapse to a single local-model scheme. ollama_model_batch
# is deliberately null on every row — retained as a column for back-compat but
# no longer consulted (MachineRecord.model_for always returns ollama_model).
#
# Restore command: python3 lab/claudecode/seed_machines.py
# Versioning: git log lab/seed/machines.yaml IS the history.
#
# Field semantics:
#   inference_rank   — lower = preferred. Router walks in ascending rank.
#   in_use_hours     — [[start, end], ...] local-hour blocks where machine is
#                      considered "human in use" and skipped for inference.
#   roles            — semantic tags (igor_home, db_host, etc.)
#   aliases          — natural-language names Igor may resolve to this host.
#   ollama_model     — the single local model on this machine (currently qwen2.5:7b
#                      for all online workers; llama3.2:1b / nomic-embed-text
#                      retained on offline boxes for their niche roles).

machines:

  - hostname: akienyoga9i
    display_name: "Yoga 9i (bedroom)"
    ip: 10.0.0.90
    os: windows
    cpu: "11th Gen Intel Core i7-1185G7 @ 3.00GHz"
    ram_gb: 16
    storage: "1TB SSD"
    hardware_model: "Lenovo Yoga 9 13ITL5"
    network_type: wifi
    status: online
    ollama_port: 11434
    ollama_model: qwen2.5:7b
    inference_rank: 1
    in_use_hours: [[20, 23]]
    roles: []
    aliases: [yoga9i, "yoga 9", bedroom, "bedroom machine", "the yoga", "yoga nine"]
