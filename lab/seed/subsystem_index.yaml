# lab/seed/subsystem_index.yaml
#
# Igor's SUBSYSTEM INDEX — directory service pointing at each load-bearing
# subsystem's canonical docstring location. Queried by CC before code surgery
# to find "where is X documented?" — the answer is a file path, and the
# file's top-of-file docstring carries the design explanation.
#
# Pattern established 2026-04-19 per T-docs-live-in-code: docs live with the
# code, not in separate DSB/CSB/design_docs files. This index is the
# directory service; the code files are the authoritative content.
#
# Schema:
#   subsystem        — canonical name (stable ID)
#   primary_file     — where the canonical top-of-file docstring lives
#   also_see         — other code files in this subsystem (ordered by relevance)
#   engrams          — memory graph node patterns that participate (may be empty)
#   decisions        — D### IDs from decisions_log.dsb that shaped the design
#   summary          — one-line human-readable description (for the index listing)
#
# Status: SKELETON. Initial entries are placeholders for the most-talked-about
# subsystems; docstrings in the primary_file are the real docs (may still be
# thin). As the sprint progresses, each subsystem gets a proper canonical
# docstring — the index serves as the worklist.
#
# Restore: python3 lab/claudecode/seed_subsystem_index.py

subsystems:

  - subsystem: reading
    primary_file: wild_igor/igor/tools/reading_engine.py
    also_see:
      - wild_igor/igor/tools/reading_tool.py
      - lab/claudecode/book_learner.py
      - wild_igor/igor/cognition/reading_indexer.py  # legacy OR-only path
    engrams:
      - WATCH_Q_*   # 9 watch questions (Akien's what-matters)
      - WATCH_T_*   # 9 watch topics
      - PROC_READING_*
    decisions: [D333, D334, D356, D358, D359, D360]
    summary: "Book / URL extraction pipeline; fetch → chunk → extract (local qwen or cloud) → deposit with full provenance. Filtered by attractor+watchlist lever score."

  - subsystem: cortex
