# lab/seed/watchlist.yaml
#
# Source-of-truth for Igor's watchlist — questions and topics that influence
# what gets captured during reading extraction (lever detection).
#
# Watch habits do NOT dispatch actions. They fire a TWM salience boost when
# a watched concept is mentioned, and their keywords join the hot-attractor
# set in book_learner._deposit_nodes to decide what's lever-relevant.
#
# Pattern: file → DB (hand-curated; DB is runtime cache).
# Restore command: python3 lab/claudecode/seed_watchlist.py
#
# Versioning: git log lab/seed/watchlist.yaml IS the history. Edits land
# via PR / commit and re-seed is idempotent (upsert on id).
#
# Provenance: originally lost from the DB sometime before 2026-04-18;
# re-dictated by Akien at ~20:50 UTC 2026-04-18 and seeded fresh.

